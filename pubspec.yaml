name: qubexcore_pos
description: QubeXCore POS — offline-first mobile retail point of sale.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  barcode: ^2.2.9
  provider: ^6.1.2
  nested: ^1.0.0
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  uuid: ^4.4.2
  intl: ^0.19.0
  cryptography: ^2.9.0
  mobile_scanner: ^7.4.2
  pdf: ^3.13.1
  share_plus: ^13.3.1
  image: ^4.12.0
  file_selector: ^1.1.0
  bluetooth_classic: ^0.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  path_provider_platform_interface: ^2.1.3

flutter:
  uses-material-design: true
  assets:
    - assets/branding/qubexcore.png
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
